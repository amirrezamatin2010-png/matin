<!doctype html><html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MATIN Admin</title><link rel="stylesheet" href="/style.css"></head><body>
<main style="padding:40px 0">
<a class="logo" href="/">MATIN<span>.</span></a>
<section class="section"><h2>پنل مدیریت</h2><p style="color:var(--muted)">کلید مدیریت را وارد کن. در سرور واقعی حتماً ADMIN_KEY را به یک مقدار قوی تغییر بده.</p>
<div class="card"><input id="key" placeholder="Admin key" type="password" style="width:100%;padding:14px;background:#0b0c12;color:white;border:1px solid var(--line);border-radius:10px"><button class="btn primary" onclick="login()" style="margin-top:12px">ورود</button></div></section>
<div id="panel" hidden>
<section class="section"><h2>Analytics</h2><div id="stats" class="grid"></div><div class="card" style="margin-top:18px"><h3>بازدیدهای اخیر</h3><div id="recent"></div></div></section>
<section class="section"><h2>انتشار محتوا</h2><form id="postForm" class="card"><input name="title" placeholder="عنوان" required style="width:100%;padding:12px;margin-bottom:10px"><textarea name="body" placeholder="متن" style="width:100%;padding:12px;min-height:100px"></textarea><select name="type" style="width:100%;padding:12px;margin:10px 0"><option value="text">متن</option><option value="image">عکس</option><option value="video">ویدیو</option><option value="audio">آهنگ</option></select><input name="file" type="file"><button class="btn primary">انتشار</button></form></section>
<section class="section"><h2>پروژه جدید</h2><form id="projectForm" class="card"><input name="name" placeholder="نام پروژه" required style="width:100%;padding:12px;margin-bottom:10px"><textarea name="description" placeholder="توضیحات" style="width:100%;padding:12px;margin-bottom:10px"></textarea><input name="tech" placeholder="Python, HTML..." style="width:100%;padding:12px;margin-bottom:10px"><input name="link" placeholder="Demo / Download URL" style="width:100%;padding:12px;margin-bottom:10px"><input name="code" placeholder="Code URL" style="width:100%;padding:12px;margin-bottom:10px"><input name="image" type="file"><button class="btn primary">افزودن پروژه</button></form></section>
<section class="section"><h2>بازی</h2><form id="gameForm" class="card"><input name="name" placeholder="نام بازی" required style="width:100%;padding:12px;margin-bottom:10px"><input name="description" placeholder="توضیحات" style="width:100%;padding:12px;margin-bottom:10px"><input name="url" placeholder="لینک بازی" required style="width:100%;padding:12px;margin-bottom:10px"><button class="btn primary">افزودن بازی</button></form></section>
</div></main><script src="/admin.js"></script></body></html>
